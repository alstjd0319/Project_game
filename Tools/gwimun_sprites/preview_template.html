<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%TITLE% 도트 애니메이션</title>
<style>
  body { margin: 0; padding: 20px; background: #5a6070; color: #fff; font-family: "Malgun Gothic", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  h2 { font-size: 16px; }
  p.note { margin: 0 0 18px; color: #dde; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; margin-bottom: 26px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .cell b { font-size: 15px; }
  .cell span { font-size: 12px; color: #ccd; }
  .anim, .strip { image-rendering: pixelated; outline: 1px dashed rgba(255,255,255,.18); }
  .anim { background-repeat: no-repeat; }
  .ground { height: 2px; background: #9aa; }
  @keyframes play { to { background-position-x: var(--end); } }
</style>
</head>
<body>
<h1>%TITLE% 도트 애니메이션 (Tools/sprites/process_sheets.ps1 결과)</h1>
<p class="note">AI 시트의 배경을 지우고 프레임을 잘라 정렬·크기 맞춤·축소한 결과 (설정은 process_sheets.ps1). 손 보정 없음.</p>
<h2>1080p 게임 화면 실제 크기 (%Z1%배)</h2>
<div class="row">%ANIM2%</div>
<h2>확대 (%Z2%배)</h2>
<div class="row">%ANIM6%</div>
<h2>프레임 낱장 (%Z3%배)</h2>
%STRIPS%
</body>
</html>
